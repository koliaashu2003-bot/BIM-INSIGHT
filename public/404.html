<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BIM Insight</title>
    <!--
      GitHub Pages SPA redirect (rafgraph/spa-github-pages).
      Rewrites /BIM-INSIGHT/<deep/path> into /BIM-INSIGHT/?/<deep/path> and
      redirects to index.html, where a matching script restores the URL so
      React Router (BrowserRouter) can handle it. pathSegmentsToKeep=1 keeps
      the "/BIM-INSIGHT" project-page prefix.
    -->
    <script>
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
