<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- GitHub Pages SPA: restore the deep URL that 404.html encoded, before the app mounts. -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>BIM Insight — AEC quiz &amp; Dynamo script library</title>
    <meta
      name="description"
      content="Learn the AEC software stack with a timed quiz, then browse and download a growing library of Dynamo scripts. Free during the beta — share your own scripts too."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BIM Insight" />
    <meta property="og:url" content="https://koliaashu2003-bot.github.io/BIM-INSIGHT/" />

    <meta
      property="og:description"
      content="29 timed questions across Revit, AutoCAD, Navisworks, Rhino/Grasshopper, Dynamo, ACC / BIM 360, and popular add-ins. See how you score and share it."
    />
    <meta property="og:image" content="https://koliaashu2003-bot.github.io/BIM-INSIGHT/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
